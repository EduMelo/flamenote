[package]
name = "flamenote"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Notas flutuantes a partir do texto selecionado, no espírito do Flameshot"
license = "MIT"
authors = ["EduMelo <dev@edumelo.com.br>"]
publish = false

[dependencies]
cairo-rs = "0.18"
gdk = "0.18"
gio = "0.18"
glib = "0.18"
gtk = "0.18"
libc = "0.2"
pango = "0.18"
x11rb = { version = "0.13", features = ["xfixes"] }
xkbcommon = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
